[package]
name = "gridcraft-haiku"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "GridCraft for air/OS and Haiku: the egui front end in a native BWindow"

# Not the workspace's lints: the native host is reached through `unsafe` FFI, confined to
# `src/host.rs` (`#[allow(unsafe_code)]` there). Everything else denies it.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "allow"
type_complexity = "allow"
# clippy.toml bans `Instant::now`, which traps on wasm; this crate is Haiku only (its event loop
# times frames and repaints).
disallowed_methods = "allow"

[[bin]]
name = "GridCraft"
path = "src/main.rs"

[dependencies]
gridcraft-engine = { workspace = true }
gridcraft-ui-egui = { workspace = true }
egui = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
rayon = { workspace = true }
# Pictures copied to the clipboard as PNG (egui's CopyImage) and pasted from it.
image = { workspace = true }
# The desktop app's control server (`apps/gridcraft/src/control_server.rs`): its token check, the
# token's random bits, and the log file's timestamps (`logging.rs`).
gridcraft-mcp = { workspace = true }
getrandom = "0.4"
# File › Print: the print-ready PDF's pages rasterised for the Be print kit (`src/print.rs`, as
# in the other Craft hosts).
hayro = "0.7.1"
chrono = { workspace = true }

[build-dependencies]
cc = "1"
